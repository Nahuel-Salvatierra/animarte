name: Deploy static site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'sa-east-1' }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm run test:unit

      - name: Build static export
        run: npm run build
        env:
          NEXT_PUBLIC_CATALOG_CDN_URL: ${{ vars.NEXT_PUBLIC_CATALOG_CDN_URL }}

      - name: Install Playwright and run e2e
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e:ci

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync static site to S3
        env:
          S3_BUCKET: ${{ vars.S3_BUCKET }}
        run: |
          if [ -z "${S3_BUCKET}" ]; then
            echo "Repository variable S3_BUCKET is required"
            exit 1
          fi

          # Hashed Next assets — long cache
          aws s3 sync out/_next/static "s3://${S3_BUCKET}/_next/static" \
            --delete \
            --cache-control "public,max-age=31536000,immutable"

          # App files — never touch catalog media or catalog JSON published by the importer
          aws s3 sync out/ "s3://${S3_BUCKET}/" \
            --delete \
            --exclude "_next/static/*" \
            --exclude "products/*" \
            --exclude "products" \
            --exclude "catalog.json" \
            --exclude "categories.json" \
            --exclude "import-report.json" \
            --exclude "review-queue.json" \
            --cache-control "public,max-age=60,s-maxage=300,must-revalidate"

      - name: Invalidate CloudFront
        env:
          DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          if [ -z "${DISTRIBUTION_ID}" ]; then
            echo "CLOUDFRONT_DISTRIBUTION_ID not set; skip invalidation"
            exit 0
          fi
          aws cloudfront create-invalidation \
            --distribution-id "${DISTRIBUTION_ID}" \
            --paths "/*"
